<title>Rate Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one ledger sheet – an entry line on top, the register below. */
:root {
  --paper: #f5f7fa; --sheet: #ffffff; --ink: #18202e; --ink-soft: #5b6678;
  --rule: #dfe4ec; --rule-strong: #c4ccd8; --accent: #2647c9; --accent-soft: #e6ebfb;
  --up: #c2341f; --up-soft: #fbe6e2; --down: #17804a; --down-soft: #ddf2e5; --warn: #9a6a00; --warn-soft: #fcf1d2;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141b; --sheet: #171d27; --ink: #e4e9f2; --ink-soft: #97a3b6; --rule: #262f3d; --rule-strong: #364254;
    --accent: #8ea6ff; --accent-soft: #1f2a4d; --up: #ff8a75; --up-soft: #3b1d18; --down: #6fd59b; --down-soft: #15321f;
    --warn: #f0c45c; --warn-soft: #362b10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141b; --sheet: #171d27; --ink: #e4e9f2; --ink-soft: #97a3b6; --rule: #262f3d; --rule-strong: #364254;
  --accent: #8ea6ff; --accent-soft: #1f2a4d; --up: #ff8a75; --up-soft: #3b1d18; --down: #6fd59b; --down-soft: #15321f;
  --warn: #f0c45c; --warn-soft: #362b10; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px;
}
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 12px; padding-top: 20px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
.sub { margin: 0; color: var(--ink-soft); font-size: .9rem; }
.mode { font-size: .78rem; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.mode.local { background: var(--warn-soft); color: var(--warn); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
.entry { display: grid; grid-template-columns: 2fr .8fr 1fr 1.2fr auto; gap: 8px; align-items: end; }
@media (max-width: 640px) { .entry { grid-template-columns: 1fr 1fr; } .entry .f-item { grid-column: 1 / -1; } .entry .btn { grid-column: 1 / -1; } }
label { display: grid; gap: 3px; font-size: .78rem; color: var(--ink-soft); font-weight: 500; min-width: 0; }
input { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 7px; padding: 8px 10px; width: 100%; min-width: 0; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.btn { font: inherit; border: 0; background: var(--accent); color: var(--sheet); font-weight: 600; padding: 9px 18px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.plain { background: none; color: var(--ink-soft); border: 1px solid var(--rule-strong); }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.preview { font-size: .9rem; padding: 8px 12px; border-radius: 8px; background: var(--paper); color: var(--ink-soft); }
.preview b { color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.toolbar input { max-width: 320px; }
.tbl-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 600; padding: 6px 8px; border-bottom: 2px solid var(--rule-strong); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
td.r, th.r { text-align: right; }
td.date { white-space: nowrap; }
.rmk { display: inline-block; font-size: .85rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
.rmk.up { background: var(--up-soft); color: var(--up); }
.rmk.down { background: var(--down-soft); color: var(--down); }
.rmk.same { background: var(--rule); color: var(--ink-soft); }
.rmk.first { background: var(--accent-soft); color: var(--accent); }
.rmk-sub { display: block; font-size: .76rem; color: var(--ink-soft); margin-top: 2px; }
.x { background: none; border: 0; color: var(--ink-soft); font-size: 1rem; cursor: pointer; padding: 4px 6px; }
.x:hover { color: var(--up); }
.confirm { display: flex; gap: 4px; align-items: center; font-size: .8rem; white-space: nowrap; }
.empty { color: var(--ink-soft); padding: 18px 4px; }
.banner { padding: 9px 12px; border-radius: 8px; font-size: .88rem; background: var(--warn-soft); color: var(--warn); }
.banner.err { background: var(--up-soft); color: var(--up); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 99px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.rmk { white-space: nowrap; }
@media (max-width: 560px) {
  thead { display: none; }
  table, tbody { display: block; }
  tbody tr { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "item rate" "date qty" "rmk act"; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  tbody td { border: 0; padding: 0; }
  td.item { grid-area: item; font-weight: 600; } td.rate { grid-area: rate; font-size: 1.05rem; }
  td.date { grid-area: date; color: var(--ink-soft); font-size: .82rem; } td.qty { grid-area: qty; color: var(--ink-soft); font-size: .82rem; }
  td.qty:not(:empty)::before { content: "Qty "; font-family: var(--f-body); }
  td.rmkc { grid-area: rmk; margin-top: 4px; } td.act { grid-area: act; align-self: end; }
  td.empty { display: block; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Rate Diary</h1>
      <p class="sub">Item ka rate likho. Agli baar likhoge to remark mein dikhega kitna badha ya ghata.</p>
    </div>
    <span class="mode" id="modeTag">Load ho raha hai…</span>
  </header>
  <div id="banner"></div>

  <form class="sheet" id="entryForm" autocomplete="off">
    <h2>Nayi entry</h2>
    <div class="entry">
      <label class="f-item">Item<input id="fItem" list="itemList" required maxlength="80" placeholder="Jaise: A4 paper"></label>
      <label>Qty<input id="fQty" type="number" min="0" step="any" placeholder="10"></label>
      <label>Rate (1 pc) ₹<input id="fRate" type="number" min="0" step="any" required placeholder="250"></label>
      <label>Date<input id="fDate" type="date" required></label>
      <button class="btn" type="submit" id="saveBtn">Jodo</button>
    </div>
    <datalist id="itemList"></datalist>
    <div class="preview" id="preview" hidden></div>
  </form>

  <section class="sheet">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Item dhundo…" aria-label="Item dhundo">
      <button class="btn plain sm" id="exportBtn" type="button">Excel (CSV) download</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Date</th><th>Item</th><th class="r">Qty</th><th class="r">Rate (1 pc)</th><th>Remark</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const showDate = (s) => (s ? s.split("-").reverse().join("-") : "");          // 2026-05-10 -> 10-05-2026
  const money = (n) => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400); }

  // Same item even if written a little differently: "A4 Paper", "a4  paper", "paper a4"
  function keyOf(name) {
    return [...new Set(String(name).toLowerCase()
      .replace(/(\d)\s*(gsm|gm|g|kg|ml|pages|page|pg)\b/g, "$1$2")
      .replace(/[^a-z0-9ऀ-ॿ]+/g, " ").trim().split(/\s+/).filter(Boolean)
      .map((t) => (t.length > 3 && /[a-z]s$/.test(t) && !/ss$/.test(t) ? t.slice(0, -1) : t)))].sort().join(" ");
  }

  // ---------- storage: online (db) on Claude, browser otherwise ----------
  let rows = [], db = null, downloads = null, ready = false;
  const LKEY = "rateDiary.simple.v1";
  const localLoad = () => { try { rows = JSON.parse(localStorage.getItem(LKEY)) || []; } catch (e) { rows = []; } };
  const localSave = () => { try { localStorage.setItem(LKEY, JSON.stringify(rows)); } catch (e) { banner("Is browser mein save nahi ho paya.", "err"); } };
  function banner(m, k = "") { $("#banner").innerHTML = m ? `<div class="banner ${k}">${m}</div>` : ""; }
  async function put(r) { if (db) return db.collection("entries").doc(r.id).set(r); rows.push(r); localSave(); render(); }
  async function del(id) { if (db) return db.collection("entries").doc(id).delete(); rows = rows.filter((r) => r.id !== id); localSave(); render(); }

  function useLocal(msg) {
    if (ready) return;
    ready = true; localLoad();
    $("#modeTag").textContent = "Sirf is browser mein save"; $("#modeTag").className = "mode local";
    if (msg) banner(msg);
    render();
  }
  async function init() {
    $("#fDate").value = today();
    render();
    if (!window.claude || typeof window.claude.use !== "function") return useLocal();
    const guard = setTimeout(() => useLocal("Online storage se jawab nahi aaya – abhi data sirf is browser mein save hoga."), 10000);
    const [d, dl] = await Promise.all([claude.use("db"), claude.use("downloads")]);
    downloads = dl;
    if (!d) { clearTimeout(guard); return useLocal("Login nahi hai – data sirf is browser mein save hoga."); }
    if (ready) return;
    db = d;
    db.collection("entries").onSnapshot((snap) => {
      rows = snap.docs.map((x) => x.data());
      if (!ready) { clearTimeout(guard); ready = true; $("#modeTag").textContent = "Online save"; $("#modeTag").className = "mode"; }
      render();
    }, (e) => { clearTimeout(guard); banner("Data load nahi hua (" + esc(e.code) + "). Page dobara kholo.", "err"); });
  }

  // ---------- remark: compare with the previous entry of the same item ----------
  const order = (a, b) => (a.date === b.date ? (a.created || 0) - (b.created || 0) : a.date < b.date ? -1 : 1);
  function previousOf(key, date, created) {
    return rows.filter((r) => r.key === key && (r.date < date || (r.date === date && (r.created || 0) < created))).sort(order).at(-1) || null;
  }
  function remark(rate, prev) {
    if (!prev) return { cls: "first", text: "Pehli entry", sub: "" };
    const diff = Math.round((rate - prev.rate) * 100) / 100;
    const sub = `pehle ${money(prev.rate)} · ${showDate(prev.date)}`;
    if (diff > 0) return { cls: "up", text: `${money(diff)} badh gaye`, sub };
    if (diff < 0) return { cls: "down", text: `${money(-diff)} kam hue`, sub };
    return { cls: "same", text: "Rate same hai", sub };
  }

  let confirmId = null;
  function render() {
    // item suggestions
    const names = new Map();
    rows.slice().sort(order).forEach((r) => names.set(r.key, r.item));
    $("#itemList").innerHTML = [...names.values()].map((n) => `<option value="${esc(n)}">`).join("");

    const q = keyOf($("#search").value);
    const list = rows.filter((r) => !q || q.split(" ").every((t) => r.key.includes(t))).sort(order).reverse();
    if (!ready) { $("#rows").innerHTML = `<tr><td colspan="6" class="empty">Load ho raha hai…</td></tr>`; return; }
    if (!rows.length) { $("#rows").innerHTML = `<tr><td colspan="6" class="empty">Abhi koi entry nahi. Upar item, qty, rate aur date likh kar "Jodo" dabao.<br>Jaise: A4 paper · 10 · 250 · 10-05-2026</td></tr>`; return; }
    if (!list.length) { $("#rows").innerHTML = `<tr><td colspan="6" class="empty">"${esc($("#search").value)}" naam ka koi item nahi mila.</td></tr>`; return; }
    $("#rows").innerHTML = list.map((r) => {
      const m = remark(r.rate, previousOf(r.key, r.date, r.created || 0));
      const act = confirmId === r.id
        ? `<span class="confirm">Delete? <button class="btn sm" data-yes="${esc(r.id)}">Haan</button><button class="btn plain sm" data-no="1">Nahi</button></span>`
        : `<button class="x" data-del="${esc(r.id)}" title="Delete" aria-label="Delete">✕</button>`;
      return `<tr><td class="date num">${showDate(r.date)}</td><td class="item">${esc(r.item)}</td><td class="r num qty">${r.qty ?? ""}</td><td class="r num rate"><b>${money(r.rate)}</b></td>
        <td class="rmkc"><span class="rmk ${m.cls}">${m.text}</span>${m.sub ? `<span class="rmk-sub">${m.sub}</span>` : ""}</td><td class="r act">${act}</td></tr>`;
    }).join("");
  }

  // live preview while typing
  function updatePreview() {
    const item = $("#fItem").value.trim(), rate = $("#fRate").value, date = $("#fDate").value || today();
    const box = $("#preview");
    if (!item) { box.hidden = true; return; }
    const prev = previousOf(keyOf(item), date, Date.now());
    box.hidden = false;
    if (!prev) { box.innerHTML = "Is item ki pehli entry hogi."; return; }
    let txt = `Pichhla rate: <b>${money(prev.rate)}</b> (${showDate(prev.date)}${prev.qty ? ", qty " + prev.qty : ""})`;
    if (rate !== "") { const m = remark(Number(rate), prev); txt += ` → <span class="rmk ${m.cls}">${m.text}</span>`; }
    box.innerHTML = txt;
  }
  ["#fItem", "#fRate", "#fDate"].forEach((s) => $(s).addEventListener("input", updatePreview));

  $("#entryForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const item = $("#fItem").value.trim(), rate = Number($("#fRate").value), date = $("#fDate").value;
    if (!item || !date || isNaN(rate)) return;
    const qv = $("#fQty").value;
    const r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), item, key: keyOf(item), qty: qv === "" ? null : Number(qv), rate, date, created: Date.now() };
    const btn = $("#saveBtn"); btn.disabled = true;
    try {
      await put(r);
      const m = remark(rate, previousOf(r.key, r.date, r.created));
      toast(`${item} – ${m.text}`);
      $("#fItem").value = ""; $("#fQty").value = ""; $("#fRate").value = ""; $("#preview").hidden = true; $("#fItem").focus();
    } catch (err) { toast(err?.code === "not_granted" ? "Aapko save karne ki permission nahi hai" : "Save nahi hua, dobara try karo"); }
    finally { btn.disabled = false; }
  });

  $("#rows").addEventListener("click", async (e) => {
    const t = e.target.dataset;
    if (t.del) { confirmId = t.del; render(); }
    if (t.no) { confirmId = null; render(); }
    if (t.yes) { confirmId = null; try { await del(t.yes); toast("Entry delete ho gayi"); } catch (err) { toast("Delete nahi hua"); render(); } }
  });
  $("#search").addEventListener("input", render);

  $("#exportBtn").onclick = async () => {
    if (!rows.length) return toast("Abhi koi entry nahi hai");
    const c = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const sorted = rows.slice().sort(order);
    const csv = "﻿Date,Item,Qty,Rate (1 pc),Remark\n" + sorted.map((r) => { const m = remark(r.rate, previousOf(r.key, r.date, r.created || 0)); return [showDate(r.date), r.item, r.qty ?? "", r.rate, m.text + (m.sub ? " (" + m.sub + ")" : "")].map(c).join(","); }).join("\n");
    const filename = `rate-diary-${today()}.csv`;
    if (window.AndroidBridge) { window.AndroidBridge.shareText(filename, csv); return; }   // Android app: share sheet
    if (downloads) { try { await downloads.save({ filename, data: csv }); } catch (err) { if (err?.code !== "declined") toast("Download nahi hua"); } return; }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = filename; a.click(); } catch (err) { toast("Download nahi hua"); }
  };

  init();
})();
</script>
